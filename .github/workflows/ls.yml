name: Generate Offline HTML List

on:
  push:
    branches:
      - master
    paths:
      - 'offline/**'
      - 'covers/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate list.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          repo = "${{ github.repository }}"
          ref = "${{ github.ref_name }}"
          base = f"https://github.com/{repo}/blob/{ref}"

          offline_dir = Path("offline")
          covers_dir = Path("covers")

          cover_map = {}
          if covers_dir.exists():
              for p in covers_dir.iterdir():
                  if p.is_file():
                      cover_map[p.stem.lower()] = p.name

          games = []
          if offline_dir.exists():
              for html_file in sorted(offline_dir.iterdir(), key=lambda p: p.name.lower()):
                  if not html_file.is_file():
                      continue
                  if html_file.suffix.lower() not in {".html", ".htm"}:
                      continue

                  name = html_file.stem
                  cover_name = cover_map.get(name.lower())
                  cover_url = None
                  if cover_name:
                      cover_url = f"{base}/covers/{quote(cover_name)}"

                  games.append({
                      "name": name,
                      "cover": cover_url,
                      "url": f"{base}/offline/{quote(html_file.name)}",
                  })

          Path("list.json").write_text(
              json.dumps(games, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit updated list.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update list.json"
          file_pattern: "list.json"
