<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline HTML Games Pack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    #status {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .error {
      color: #f87171 !important;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card Component */
    .game-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .game-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .game-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-word;
      margin-bottom: 16px;
    }

    .launch-btn {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .launch-btn:hover {
      background-color: #0369a1;
    }

    .launch-btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Offline HTML Games</h1>
    <div id="status">Loading games list...</div>
  </header>

  <main>
    <div id="gameGrid" class="grid-container"></div>
  </main>

  <script>
    const LIST_URL = 'https://raw.githubusercontent.com/ert11er/Offline-HTML-Games-Pack/refs/heads/master/list.txt';
    const statusDiv = document.getElementById('status');
    const gameGrid = document.getElementById('gameGrid');

    // Fetch list.txt and generate grid cards
    async function initGrid() {
      try {
        const response = await fetch(LIST_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const text = await response.text();
        const urls = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        if (urls.length === 0) {
          statusDiv.innerText = "No games found in list.txt.";
          return;
        }

        statusDiv.innerText = `Found ${urls.length} game(s)`;

        // Build a card for each game URL
        urls.forEach(url => {
          const rawName = url.split('/').pop();
          const displayName = rawName.includes('.') ? rawName : `${rawName}.html`;

          const card = document.createElement('div');
          card.className = 'game-card';

          card.innerHTML = `
            <div class="game-icon">🎮</div>
            <div class="game-title">${displayName}</div>
            <button class="launch-btn" data-url="${url}" data-name="${displayName}">
              <span>Play & Save</span>
            </button>
          `;

          gameGrid.appendChild(card);
        });

        // Add click listener to launch/download buttons
        gameGrid.addEventListener('click', (e) => {
          const btn = e.target.closest('.launch-btn');
          if (btn) {
            handlePlayAndDownload(btn.dataset.url, btn.dataset.name, btn);
          }
        });

      } catch (err) {
        console.error(err);
        statusDiv.className = "error";
        statusDiv.innerText = "Failed to load list.txt. Check CORS or URL availability.";
      }
    }

    // Handles downloading file to disk AND opening in new tab
    async function handlePlayAndDownload(fileUrl, fileName, btnElement) {
      const originalText = btnElement.innerHTML;
      btnElement.disabled = true;
      btnElement.innerText = "Loading...";

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`Failed to fetch file: ${response.statusText}`);

        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 1. Download to disk
        const downloadLink = document.createElement('a');
        downloadLink.href = blobUrl;
        downloadLink.download = fileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // 2. Launch in new browser tab
        window.open(blobUrl, '_blank');

      } catch (err) {
        console.error(err);
        alert(`Error opening ${fileName}`);
      } finally {
        btnElement.disabled = false;
        btnElement.innerHTML = originalText;
      }
    }

    initGrid();
  </script>
</body>
</html>
