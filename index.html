<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Games URL Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 30px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 1.8rem;
      color: #58a6ff;
      margin-bottom: 8px;
    }

    #status {
      color: #8b949e;
      font-size: 0.9rem;
    }

    .error {
      color: #f85149 !important;
    }

    /* Grid layout for URL cards */
    .url-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* URL Card Component */
    .url-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      word-break: break-all;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .url-card:hover {
      border-color: #58a6ff;
      transform: translateY(-2px);
    }

    .url-title {
      font-size: 0.85rem;
      color: #7ee787;
      font-weight: bold;
    }

    .url-text {
      font-size: 0.8rem;
      color: #8b949e;
      background: #0d1117;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #21262d;
      max-height: 80px;
      overflow-y: auto;
    }

    .action-btn {
      width: 100%;
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .action-btn:hover {
      background-color: #2ea043;
    }

    .action-btn:disabled {
      background-color: #343942;
      color: #6e7681;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Offline HTML Games Directory</h1>
    <div id="status">Fetching list...</div>
  </header>

  <main>
    <div id="urlGrid" class="url-grid"></div>
  </main>

  <script>
    const LIST_URL = 'https://raw.githubusercontent.com/ert11er/Offline-HTML-Games-Pack/refs/heads/master/list.txt';
    const statusDiv = document.getElementById('status');
    const urlGrid = document.getElementById('urlGrid');

    async function loadGrid() {
      try {
        const response = await fetch(LIST_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const text = await response.text();
        const urls = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        if (urls.length === 0) {
          statusDiv.innerText = "No URLs found in list.txt.";
          return;
        }

        statusDiv.innerText = `Displaying ${urls.length} game URL(s)`;

        // Render each file URL as a card in the grid
        urls.forEach((url, index) => {
          const rawFileName = url.split('/').pop();
          const fileName = rawFileName.includes('.') ? rawFileName : `${rawFileName}.html`;

          const card = document.createElement('div');
          card.className = 'url-card';

          card.innerHTML = `
            <div>
              <div class="url-title">FILE #${index + 1}: ${fileName}</div>
              <div class="url-text">${url}</div>
            </div>
            <button class="action-btn" data-url="${url}" data-filename="${fileName}">
              Download & Launch
            </button>
          `;

          urlGrid.appendChild(card);
        });

        // Event listener for buttons inside grid cards
        urlGrid.addEventListener('click', (e) => {
          if (e.target.classList.contains('action-btn')) {
            const btn = e.target;
            handleDownloadAndLaunch(btn.dataset.url, btn.dataset.filename, btn);
          }
        });

      } catch (err) {
        console.error(err);
        statusDiv.className = "error";
        statusDiv.innerText = "Failed to load list.txt.";
      }
    }

    async function handleDownloadAndLaunch(fileUrl, fileName, btnElement) {
      const originalText = btnElement.innerText;
      btnElement.disabled = true;
      btnElement.innerText = "Processing...";

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`Failed to fetch file: ${response.statusText}`);

        const text = await response.text();
        const blob = new Blob([text], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // Download to computer
        const downloadLink = document.createElement('a');
        downloadLink.href = blobUrl;
        downloadLink.download = fileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // Launch in new tab
        window.open(blobUrl, '_blank');

      } catch (err) {
        console.error(err);
        alert(`Failed to download ${fileName}`);
      } finally {
        btnElement.disabled = false;
        btnElement.innerText = originalText;
      }
    }

    loadGrid();
  </script>
</body>
</html>
