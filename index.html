<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline HTML Games</title>
  <link href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" rel="icon">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f4f6f8; color: #333; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: #222; font-size: 2rem; margin-bottom: 8px; }
    #status { font-size: .9rem; color: #666; }
    .error { color: #d9534f !important; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .grid-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 4px 12px #00000014; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; transition: transform .2s ease, box-shadow .2s ease; }
    .grid-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px #0000001f; }
    .cover { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; margin-bottom: 12px; background: #eee; }
    .card-title { font-weight: 600; font-size: .95rem; margin-bottom: 14px; overflow-wrap: anywhere; color: #222; }
    .play-btn { display: block; width: 100%; background: #8bbbe5; color: white; border: 0; padding: 10px 12px; font-size: .9rem; font-weight: 600; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .play-btn:hover { background: #06c; }
  </style>
</head>
<body>
  <header>
    <h1>Offline HTML Games</h1>
    <div id="status">Loading games...</div>
  </header>
  <main><div id="gridContainer" class="grid-container"></div></main>
  <script>
    const statusDiv = document.getElementById('status');
    const gridContainer = document.getElementById('gridContainer');

    async function loadGames() {
      try {
        const response = await fetch('./list.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const games = await response.json();
        if (!Array.isArray(games) || games.length === 0) {
          statusDiv.textContent = 'No games found.';
          return;
        }

        for (const game of games) {
          if (!game || typeof game.name !== 'string' || typeof game.url !== 'string') continue;
          const card = document.createElement('article');
          card.className = 'grid-card';

          if (typeof game.cover === 'string' && game.cover) {
            const cover = document.createElement('img');
            cover.className = 'cover';
            cover.src = game.cover;
            cover.alt = `${game.name} cover`;
            cover.loading = 'lazy';
            cover.onerror = () => cover.remove();
            card.appendChild(cover);
          }

          const title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = game.name;
          card.appendChild(title);

          const play = document.createElement('a');
          play.className = 'play-btn';
          play.href = game.url;
          play.target = '_blank';
          play.rel = 'noopener';
          play.textContent = 'Play Game';
          card.appendChild(play);
          gridContainer.appendChild(card);
        }
        statusDiv.textContent = `Loaded ${gridContainer.childElementCount} game(s).`;
      } catch (error) {
        console.error(error);
        statusDiv.className = 'error';
        statusDiv.textContent = 'Failed to load list.json.';
      }
    }

    loadGames();
  </script>
</body>
</html>
