<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Offline HTML Games</title>
  <link href="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" rel="icon">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f4f6f8; color: #333; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: #222; font-size: 2rem; margin-bottom: 8px; }
    #status { font-size: .9rem; color: #666; }
    .error { color: #d9534f !important; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .grid-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 4px 12px #00000014; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; transition: transform .2s ease, box-shadow .2s ease; }
    .grid-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px #0000001f; }
    .cover { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 6px; margin-bottom: 12px; background: #eee; }
    .card-title { font-weight: 600; font-size: .95rem; margin-bottom: 14px; overflow-wrap: anywhere; color: #222; }
    .download-btn { width: 100%; background: #8bbbe5; color: white; border: 0; padding: 10px 12px; font-size: .9rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .download-btn:hover { background: #06c; }
    .download-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Offline HTML Games</h1>
    <div id="status">Fetching games...</div>
  </header>
  <main><div id="gridContainer" class="grid-container"></div></main>
  <script>
    const LIST_URL = 'https://raw.githubusercontent.com/ert11er/Offline-HTML-Games-Pack/master/list.json';
    const statusDiv = document.getElementById('status');
    const gridContainer = document.getElementById('gridContainer');

    async function loadGames() {
      try {
        const response = await fetch(LIST_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const games = await response.json();
        if (!Array.isArray(games) || games.length === 0) {
          statusDiv.textContent = 'No games found in list.json.';
          return;
        }

        for (const game of games) {
          if (!game || typeof game.name !== 'string' || typeof game.url !== 'string') continue;
          const card = document.createElement('article');
          card.className = 'grid-card';

          if (typeof game.cover === 'string' && game.cover) {
            const cover = document.createElement('img');
            cover.className = 'cover';
            cover.src = game.cover;
            cover.alt = `${game.name} cover`;
            cover.loading = 'lazy';
            cover.onerror = () => cover.remove();
            card.appendChild(cover);
          }

          const title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = game.name;
          card.appendChild(title);

          const button = document.createElement('button');
          button.className = 'download-btn';
          button.dataset.url = game.url;
          button.dataset.name = `${game.name}.html`;
          button.textContent = 'Play & Download';
          card.appendChild(button);
          gridContainer.appendChild(card);
        }
        statusDiv.textContent = `Loaded ${gridContainer.childElementCount} game(s) from list.json.`;
      } catch (error) {
        console.error(error);
        statusDiv.className = 'error';
        statusDiv.textContent = 'Failed to load list.json.';
      }
    }

    gridContainer.addEventListener('click', async (event) => {
      const button = event.target.closest('.download-btn');
      if (!button) return;

      const fileUrl = button.dataset.url;
      const fileName = button.dataset.name;
      button.disabled = true;
      button.textContent = 'Loading...';
      let blobUrl;

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`Download failed: ${response.status}`);
        const blob = await response.blob();
        blobUrl = URL.createObjectURL(blob);

        const downloadLink = document.createElement('a');
        downloadLink.href = blobUrl;
        downloadLink.download = fileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();
        window.open(blobUrl, '_blank', 'noopener');
      } catch (error) {
        console.error(error);
        alert(`Error opening ${fileName}`);
      } finally {
        button.disabled = false;
        button.textContent = 'Play & Download';
        if (blobUrl) setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      }
    });

    loadGames();
  </script>
</body>
</html>
